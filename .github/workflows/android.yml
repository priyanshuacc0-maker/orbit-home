name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Also build a release APK (requires signing secrets)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets are passed as environment variables, never interpolated into a
      # shell script line — an interpolated secret is one typo away from being
      # echoed into a public log (remediation 6.22).
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Provision cmdline-tools and accept licences explicitly. The third-party
      # setup-android action blocks on an interactive "Accept? (y/N)" prompt.
      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using SDK at $SDK"
          curl -sL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/cmdline-tools/tmp"
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools/tmp"
          mv "$SDK/cmdline-tools/tmp/cmdline-tools" "$SDK/cmdline-tools/latest"
          rm -rf "$SDK/cmdline-tools/tmp"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          yes | "$SM" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      # Stable signing key from repo secrets, so every build installs over the
      # previous one instead of needing an uninstall first.
      #
      # The file is written only when *every* required secret is present. A partial
      # set used to produce a keystore.properties with blank fields, which fails
      # deep inside the Android plugin with an unhelpful message. Absent secrets are
      # normal on a fork or a non-release run: the build then falls back to the
      # debug key, which app/build.gradle.kts already handles (remediation 6.22).
      - name: Write signing keystore
        id: signing
        run: |
          set -e
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "Signing secrets not fully set (missing:$missing)."
            echo "Building with the debug key instead."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > orbit-home.jks
          # Written from the environment, and never printed.
          {
            echo "storeFile=orbit-home.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Stable signing key written."

      # A release build is explicitly requested, so missing secrets are a hard
      # error rather than a silent fallback to a key the user cannot ship with.
      - name: Require signing secrets for a release build
        if: ${{ inputs.build_release }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            echo "::error::A release build was requested but the signing secrets are not set."
            echo "::error::Set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD as repository secrets."
            exit 1
          fi

      # Tests first (P0-14): a red test must stop the job before anything is
      # built or uploaded, rather than after.
      - name: Run unit tests
        run: chmod +x ./gradlew && ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Debug only by default. The release variant roughly doubled build time and
      # added nothing for everyday testing, so it is opt-in.
      - name: Build release APK
        if: ${{ inputs.build_release }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-home-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          overwrite: true

      # The artifact store is shared by the whole account and can be full; a release is not. The APK is
      # attached to a release as well, so it can always be fetched.
      - name: Attach the APK to a release
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          apk=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$apk" ]; then echo "no apk to attach"; exit 0; fi
          tag="build-${{ github.run_number }}"
          gh release create "$tag" "$apk#orbit-home-debug.apk" \
            --title "$tag" --notes "Debug build from run ${{ github.run_number }}." \
            --repo "${{ github.repository }}" || true

      - name: Upload release APK
        if: ${{ inputs.build_release }}
        uses: actions/upload-artifact@v4
        with:
          name: orbit-home-apk-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          overwrite: true
